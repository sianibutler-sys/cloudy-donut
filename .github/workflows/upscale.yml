name: upscale
on:
  workflow_dispatch:
    inputs:
      src: { description: "Image path in the repo", required: true, default: "assets/exp-trays.jpg" }
permissions:
  contents: write
jobs:
  up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install spandrel pillow numpy
      - run: curl -sSL -o /tmp/x4.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
      - run: python scripts/upscale.py "${{ inputs.src }}" /tmp/x4.pth
      - run: |
          git config user.name "og-bot"; git config user.email "og-bot@users.noreply.github.com"
          git add assets/*-hd.jpg && git commit -m "Upscaled photo" && git push || echo "nothing to commit"
